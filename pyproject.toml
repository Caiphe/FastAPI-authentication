[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-auth-starter"
version = "0.1.0"
description = "A reusable FastAPI authentication starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "celery[redis]>=5.4,<6.0",
    "email-validator>=2.1,<3.0",
    "fastapi[standard]>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "pyjwt>=2.10,<3.0",
    "redis>=5.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "celery-types>=0.23",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL service from compose.yaml with migrations applied",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.email" = ["templates/*.html", "templates/*.txt"]

